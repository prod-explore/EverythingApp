# EverythingApp — Docker Compose
# Sandbox Hardening, Playwright browser agent, Git Proxy, Orchestrator
#
# Run: docker compose up
# Prerequisites:
#   1. docker build -t everything-sandbox:latest ./sandbox-supervisor/sandbox-image/
#   2. Copy .env.example → .env and fill in all required values
#   3. For GitHub: set GITHUB_PAT in .env
#   4. For Playwright: set PLAYWRIGHT_MCP_API_KEY in .env

services:
  sandbox-supervisor:
    container_name: everythingapp-sandbox-supervisor
    build:
      context: ./sandbox-supervisor
      dockerfile: Dockerfile
      args:
        # Must match the host's docker.sock group, or `node` inside the
        # container gets EACCES talking to Docker. Get it with:
        #   stat -c '%g' /var/run/docker.sock
        DOCKER_GID: ${DOCKER_GID:-999}
    # Supervisor is the ONLY service that holds docker.sock.
    # sandbox-mcp and playwright-mcp talk to it over the internal network.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Shared secret for the supervisor API (exec / files / volumes of every sandbox): sandbox-mcp and the web server send it.
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:?SUPERVISOR_TOKEN is required (openssl rand -hex 32)}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-everything-sandbox:latest}
      SUPERVISOR_PORT: ${SUPERVISOR_PORT:-3001}
      # One sandbox per project (or standalone chat); idle ones are STOPPED, never deleted, workspace volumes are kept.
      MAX_RUNNING_SANDBOXES: ${MAX_RUNNING_SANDBOXES:-2}
      SANDBOX_IDLE_TIMEOUT_MS: ${SANDBOX_IDLE_TIMEOUT_MS:-1800000}   # 30 min
      SANDBOX_WATCHDOG_INTERVAL_MS: ${SANDBOX_WATCHDOG_INTERVAL_MS:-120000} # 2 min
      TERMINAL_IDLE_TIMEOUT_MS: ${TERMINAL_IDLE_TIMEOUT_MS:-900000}  # 15 min
      MAX_TERMINALS_PER_SANDBOX: ${MAX_TERMINALS_PER_SANDBOX:-4}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-512}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-1}
      # Sandboxes live on their own bridge (created by the supervisor); fence it off from the LAN with
      # deploy/egress-guard.sh (EGRESS_BRIDGES must include br-ea-sandbox).
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-ea-sandbox-egress}
      SANDBOX_BRIDGE_NAME: ${SANDBOX_BRIDGE_NAME:-br-ea-sandbox}
      # preview_sandbox: the shared browser container is attached, on demand, to a private no-route-out network together
      # with ONE sandbox, so the agent can look at the dev server it is building. Empty = off.
      PREVIEW_BROWSER_CONTAINER: ${PREVIEW_BROWSER_CONTAINER:-everythingapp-playwright-mcp}
      # SANDBOX_RUNTIME: runsc   # optional gVisor
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    networks:
      - sandbox-internal
    # Limits for the services themselves (sandboxes have their own, set by the supervisor). Raise one if its
    # container gets OOM-killed under real load.
    mem_limit: 256m
    cpus: 1
    pids_limit: 256

  sandbox-mcp:
    container_name: everythingapp-sandbox-mcp
    build:
      context: ./sandbox-mcp
      dockerfile: Dockerfile
    environment:
      SUPERVISOR_URL: http://sandbox-supervisor:3001
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:?SUPERVISOR_TOKEN is required (openssl rand -hex 32)}
      MCP_PORT: ${MCP_PORT:-3002}
      SANDBOX_TIMEOUT_MS: ${SANDBOX_TIMEOUT_MS:-30000}
      MCP_API_KEY: ${MCP_API_KEY:?MCP_API_KEY is required}
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - sandbox-supervisor
    restart: unless-stopped
    networks:
      - sandbox-internal
    mem_limit: 256m
    cpus: 1
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Playwright browser tool — controlled web browsing. Observations are built deterministically
  # (sanitised, length-bounded, wrapped as untrusted data, injection heuristically flagged); no model
  # sits between the page and the agent. The orchestrator asks the user per domain before the browser
  # may go there (Allow once / this chat / always).
  # Network: public internet allowed; private networks are NOT (see deploy/egress-guard.sh
  # for the network layer and playwright-mcp/src/urlSafety.ts for the application layer).
  # No docker.sock. Lives on its own `browser-egress` bridge — it shares NO network with the
  # supervisor, sandbox-mcp, github-mcp (holds the PAT) or n8n; only the web server is attached
  # to both sides so it can call the MCP endpoint.
  playwright-mcp:
    container_name: everythingapp-playwright-mcp
    build:
      context: ./playwright-mcp
      dockerfile: Dockerfile
    environment:
      MCP_PORT: 3003
      MCP_API_KEY: ${PLAYWRIGHT_MCP_API_KEY:?PLAYWRIGHT_MCP_API_KEY is required}
      NAV_TIMEOUT_MS: ${NAV_TIMEOUT_MS:-30000}
      # §6b: browser-agent sessions (browser_open/observe/act/close).
      PLAYWRIGHT_MAX_SESSIONS: ${PLAYWRIGHT_MAX_SESSIONS:-4}
      PLAYWRIGHT_SESSION_IDLE_TIMEOUT_MS: ${PLAYWRIGHT_SESSION_IDLE_TIMEOUT_MS:-1800000}
      PLAYWRIGHT_WATCHDOG_INTERVAL_MS: ${PLAYWRIGHT_WATCHDOG_INTERVAL_MS:-120000}
      # SSRF guard: the browser may only reach the PUBLIC internet. Comma-separated private
      # hostnames/IPs to allow on purpose (default none), e.g. a NAS you want the agent to read.
      BROWSER_ALLOW_PRIVATE_HOSTS: ${BROWSER_ALLOW_PRIVATE_HOSTS:-}
      # N3b browser policy (operator layer; the cli's per-project `_policy` can only tighten it).
      # Comma-separated globs like *.example.com. Empty allowlist = any public domain.
      BROWSER_DOMAIN_ALLOW: ${BROWSER_DOMAIN_ALLOW:-}
      BROWSER_DOMAIN_DENY: ${BROWSER_DOMAIN_DENY:-}
      BROWSER_JS_POLICY: ${BROWSER_JS_POLICY:-allowed}   # disabled | review | allowed
      # Observation v2: deterministic observations.
      OBSERVATION_MAX_TEXT_CHARS: ${OBSERVATION_MAX_TEXT_CHARS:-12000}
    # No volumes on purpose: browser profiles are EPHEMERAL (no persistent logins). A leftover
    # `playwright_profiles` volume from older versions can be deleted:
    #   docker volume rm <project>_playwright_profiles
    ports:
      - "127.0.0.1:3003:3003"
    restart: unless-stopped
    # Playwright gets outbound internet access (it's a browser, it needs it) on a dedicated
    # bridge, so a page (or a prompt-injected URL) cannot reach the other services by name.
    networks:
      - browser-egress
    # PLAYWRIGHT_MAX_SESSIONS Chromium instances live in here (~400 MB each).
    mem_limit: 2g
    cpus: 2
    pids_limit: 1024


  # N4: git smart-HTTP proxy to github.com. Sandboxes push/pull through it with short-lived proxy
  # tokens; the real GitHub credential (from the orchestrator, or GITHUB_PAT as fallback) is injected
  # here and never reaches the sandbox. Pushes become approval cards unless the repo's pushMode allows.
  # Reachability from the sandbox bridge (br-ea-sandbox has ICC disabled, so it can't share that bridge):
  # publish the port on the sandbox bridge gateway via GIT_PROXY_BIND and allow it in deploy/egress-guard.sh
  # (EGRESS_ALLOW="<gateway-ip>:8080"); the default only binds loopback.
  git-proxy:
    container_name: everythingapp-git-proxy
    build:
      context: ./git-proxy
      dockerfile: Dockerfile
    environment:
      GIT_PROXY_PORT: 8080
      GIT_PROXY_ADMIN_TOKEN: ${GIT_PROXY_ADMIN_TOKEN:?GIT_PROXY_ADMIN_TOKEN is required}
      ORCHESTRATOR_URL: ${GIT_PROXY_ORCHESTRATOR_URL:-http://everythingapp-web:3000}
      GITHUB_PAT: ${GITHUB_PAT:-}
      PUSH_APPROVAL_TIMEOUT_MS: ${PUSH_APPROVAL_TIMEOUT_MS:-600000}   # 10 min
      GIT_PROXY_PROTECTED_BRANCHES: ${GIT_PROXY_PROTECTED_BRANCHES:-main,master}
      GIT_PROXY_DEFAULT_TOKEN_TTL_SECONDS: ${GIT_PROXY_DEFAULT_TOKEN_TTL_SECONDS:-3600}
      GIT_PROXY_MAX_TOKEN_TTL_SECONDS: ${GIT_PROXY_MAX_TOKEN_TTL_SECONDS:-86400}
    ports:
      - "${GIT_PROXY_BIND:-127.0.0.1}:8080:8080"
    restart: unless-stopped
    networks:
      - sandbox-internal
    mem_limit: 256m
    cpus: 1
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Core EverythingApp web server
  everythingapp-web:
    image: everythingapp-web:latest
    build:
      context: .
      dockerfile: cli/Dockerfile
    environment:
      KEY_VAULT_SECRET: ${KEY_VAULT_SECRET:?KEY_VAULT_SECRET is required}
      SERVER_AUTH_TOKEN: ${SERVER_AUTH_TOKEN:?SERVER_AUTH_TOKEN is required}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
      # Time zone of the daily digest ("once per local day"); UTC when empty.
      TZ: ${TZ:-UTC}
      # Optional: where always-allow / always-block command prefixes and known domains live (hot-reloaded).
      EVERYTHINGAPP_POLICY_FILE: ${EVERYTHINGAPP_POLICY_FILE:-}
      PORT: 3000
      # Connectors: add playwright when services are deployed.
      MCP_CONNECTORS: ${EVERYTHINGAPP_MCP_CONNECTORS:-sandbox,playwright}
      MCP_SANDBOX_URL: http://sandbox-mcp:3002/mcp/sse
      MCP_SANDBOX_API_KEY: ${MCP_API_KEY:-}
      MCP_PLAYWRIGHT_URL: http://playwright-mcp:3003/mcp/sse
      MCP_PLAYWRIGHT_API_KEY: ${PLAYWRIGHT_MCP_API_KEY:-}
      MCP_OBSIDIAN_URL: ${MCP_OBSIDIAN_URL:-}
      MCP_OBSIDIAN_API_KEY: ${MCP_OBSIDIAN_API_KEY:-}
      # N3: workspace Explorer / checkpoints (byte reads + in-sandbox git only).
      SUPERVISOR_URL: http://sandbox-supervisor:3001
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:?SUPERVISOR_TOKEN is required (openssl rand -hex 32)}
      # N4: git-proxy (orchestrator mints sandbox tokens; git-proxy calls back /internal/*).
      GIT_PROXY_URL: http://git-proxy:8080
      GIT_PROXY_ADMIN_TOKEN: ${GIT_PROXY_ADMIN_TOKEN:?GIT_PROXY_ADMIN_TOKEN is required}
      # URL git INSIDE the sandbox uses for the proxy (sandbox bridge gateway + GIT_PROXY_BIND port).
      GIT_PROXY_SANDBOX_URL: ${GIT_PROXY_SANDBOX_URL:-http://git-proxy:8080}
      # GitHub App (device flow). Without it, connect with a fine-grained PAT in Settings → GitHub.
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      # web_search defaults for a fresh install (Settings → Web overrides them): a SearXNG URL and/or a Brave key.
      SEARXNG_URL: ${SEARXNG_URL:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      # Ghost chats: which connectors they may use (comma-separated; empty = none). Web, browser, GitHub and connectors added by hand are never in the list.
      GHOST_CONNECTORS: ${GHOST_CONNECTORS-sandbox,obsidian}
      # Usage / audit / replay rows older than this many months are deleted daily (0 = keep everything). Chats are never deleted.
      RETENTION_MONTHS: ${RETENTION_MONTHS:-12}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - everythingapp_web_data:/home/node/.everythingapp
    depends_on:
      - sandbox-mcp
      - playwright-mcp
      - git-proxy
    container_name: everythingapp-web
    restart: unless-stopped
    mem_limit: 768m
    cpus: 2
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - sandbox-internal
      - browser-egress  # only to call playwright-mcp; the browser's own requests are guarded (urlSafety.ts)
      - futumore-network

networks:
  # Sandbox stack — zero overlap with Skarpa Bytom or any other Compose stack.
  sandbox-internal:
    driver: bridge

  # Browser agent: internet-facing. The fixed bridge name lets deploy/egress-guard.sh drop
  # traffic from it to private ranges (LAN, host, other bridges) at the network layer.
  browser-egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-ea-browser

  futumore-network:
    external: true

volumes:
  everythingapp_web_data:


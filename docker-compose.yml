# EverythingApp — Docker Compose
# Phase 4: Sandbox Hardening, Playwright, GitHub Connector, n8n Pipelines
#
# Run: docker compose up
# Prerequisites:
#   1. docker build -t everything-sandbox:latest ./sandbox-supervisor/sandbox-image/
#   2. Copy .env.example → .env and fill in all required values
#   3. For GitHub: set GITHUB_PAT in .env
#   4. For n8n: set N8N_USER, N8N_PASSWORD, N8N_RESEND_API_KEY in .env
#   5. For Playwright: set PLAYWRIGHT_MCP_API_KEY in .env

services:
  sandbox-supervisor:
    build:
      context: ./sandbox-supervisor
      dockerfile: Dockerfile
      args:
        # Must match the host's docker.sock group, or `node` inside the
        # container gets EACCES talking to Docker. Get it with:
        #   stat -c '%g' /var/run/docker.sock
        DOCKER_GID: ${DOCKER_GID:-999}
    # Supervisor is the ONLY service that holds docker.sock.
    # sandbox-mcp and playwright-mcp talk to it over the internal network.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-everything-sandbox:latest}
      SUPERVISOR_PORT: ${SUPERVISOR_PORT:-3001}
      # One sandbox per project (or standalone chat); idle ones are STOPPED, never deleted, workspace volumes are kept.
      MAX_RUNNING_SANDBOXES: ${MAX_RUNNING_SANDBOXES:-2}
      SANDBOX_IDLE_TIMEOUT_MS: ${SANDBOX_IDLE_TIMEOUT_MS:-1800000}   # 30 min
      SANDBOX_WATCHDOG_INTERVAL_MS: ${SANDBOX_WATCHDOG_INTERVAL_MS:-120000} # 2 min
      TERMINAL_IDLE_TIMEOUT_MS: ${TERMINAL_IDLE_TIMEOUT_MS:-900000}  # 15 min
      MAX_TERMINALS_PER_SANDBOX: ${MAX_TERMINALS_PER_SANDBOX:-4}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-1024}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-2}
      # Sandboxes live on their own bridge (created by the supervisor); fence it off from the LAN with
      # deploy/egress-guard.sh (EGRESS_BRIDGES must include br-ea-sandbox).
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-ea-sandbox-egress}
      SANDBOX_BRIDGE_NAME: ${SANDBOX_BRIDGE_NAME:-br-ea-sandbox}
      # SANDBOX_RUNTIME: runsc   # optional gVisor
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    networks:
      - sandbox-internal

  sandbox-mcp:
    build:
      context: ./sandbox-mcp
      dockerfile: Dockerfile
    environment:
      SUPERVISOR_URL: http://sandbox-supervisor:3001
      MCP_PORT: ${MCP_PORT:-3002}
      SANDBOX_TIMEOUT_MS: ${SANDBOX_TIMEOUT_MS:-30000}
      AUTO_APPROVE_TOOLS: ${AUTO_APPROVE_TOOLS:-}
      MCP_API_KEY: ${MCP_API_KEY:?MCP_API_KEY is required}
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - sandbox-supervisor
    restart: unless-stopped
    networks:
      - sandbox-internal

  # Playwright browser tool — controlled web browsing with dual-LLM quarantine.
  # Raw page content NEVER reaches the agent: it's filtered through the local
  # quarantine model (QUARANTINE_MODEL_URL) before being returned.
  # Network: public internet allowed; private networks are NOT (see deploy/egress-guard.sh
  # for the network layer and playwright-mcp/src/urlSafety.ts for the application layer).
  # No docker.sock. Lives on its own `browser-egress` bridge — it shares NO network with the
  # supervisor, sandbox-mcp, github-mcp (holds the PAT) or n8n; only the web server is attached
  # to both sides so it can call the MCP endpoint.
  playwright-mcp:
    build:
      context: ./playwright-mcp
      dockerfile: Dockerfile
    environment:
      MCP_PORT: 3003
      MCP_API_KEY: ${PLAYWRIGHT_MCP_API_KEY:?PLAYWRIGHT_MCP_API_KEY is required}
      # URL of your local OpenAI-compatible API for quarantine extraction.
      # host.docker.internal resolves to the Docker host — use the IP of
      # the machine running LM Studio / Ollama if on the same LAN.
      QUARANTINE_MODEL_URL: ${QUARANTINE_MODEL_URL:-http://host.docker.internal:11434/v1}
      QUARANTINE_MODEL: ${QUARANTINE_MODEL:-llama-3.1-8b-instruct}
      QUARANTINE_MAX_INPUT_CHARS: ${QUARANTINE_MAX_INPUT_CHARS:-80000}
      NAV_TIMEOUT_MS: ${NAV_TIMEOUT_MS:-30000}
      # §6b: browser-agent sessions (browser_open/observe/act/close).
      PLAYWRIGHT_MAX_SESSIONS: ${PLAYWRIGHT_MAX_SESSIONS:-4}
      PLAYWRIGHT_SESSION_IDLE_TIMEOUT_MS: ${PLAYWRIGHT_SESSION_IDLE_TIMEOUT_MS:-1800000}
      PLAYWRIGHT_WATCHDOG_INTERVAL_MS: ${PLAYWRIGHT_WATCHDOG_INTERVAL_MS:-120000}
      OBSERVATION_MAX_INPUT_CHARS: ${OBSERVATION_MAX_INPUT_CHARS:-40000}
      # SSRF guard: the browser may only reach the PUBLIC internet. Comma-separated private
      # hostnames/IPs to allow on purpose (default none), e.g. a NAS you want the agent to read.
      BROWSER_ALLOW_PRIVATE_HOSTS: ${BROWSER_ALLOW_PRIVATE_HOSTS:-}
    # No volumes on purpose: browser profiles are EPHEMERAL (no persistent logins). A leftover
    # `playwright_profiles` volume from older versions can be deleted:
    #   docker volume rm <project>_playwright_profiles
    ports:
      - "127.0.0.1:3003:3003"
    restart: unless-stopped
    # Playwright gets outbound internet access (it's a browser, it needs it) on a dedicated
    # bridge, so a page (or a prompt-injected URL) cannot reach the other services by name.
    networks:
      - browser-egress

  # GitHub connector — official github-mcp-server.
  # Token (PAT) is held here, never in the bash sandbox, never visible to the model.
  # The model uses GitHub tools (read, create PR, push via push_files) through
  # this connector. git push is removed from the sandbox tool whitelist.
  github-mcp:
    image: ghcr.io/github/github-mcp-server:latest
    environment:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PAT:?GITHUB_PAT is required for GitHub connector}
      # Toolset: "all" exposes all tools. Narrow with comma-separated tool names
      # if you want to limit surface area.
      # GITHUB_TOOLSETS: repos,files,pull_requests,issues,code_security
    ports:
      - "127.0.0.1:3004:3004"
    restart: unless-stopped
    networks:
      - sandbox-internal

  # Core EverythingApp web server
  everythingapp-web:
    build:
      context: .
      dockerfile: cli/Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}  # optional legacy fallback
      KEY_VAULT_SECRET: ${KEY_VAULT_SECRET:?KEY_VAULT_SECRET is required}
      SERVER_AUTH_TOKEN: ${SERVER_AUTH_TOKEN:?SERVER_AUTH_TOKEN is required}
      PORT: 3000
      # Connectors: add playwright and github when services are deployed.
      MCP_CONNECTORS: ${EVERYTHINGAPP_MCP_CONNECTORS:-sandbox,obsidian,playwright,github}
      MCP_SANDBOX_URL: http://sandbox-mcp:3002/mcp/sse
      MCP_SANDBOX_API_KEY: ${MCP_API_KEY:-}
      MCP_PLAYWRIGHT_URL: http://playwright-mcp:3003/mcp/sse
      MCP_PLAYWRIGHT_API_KEY: ${PLAYWRIGHT_MCP_API_KEY:-}
      # github-mcp-server uses its own auth (PAT via env above),
      # so no separate API key needed for the connector URL.
      MCP_GITHUB_URL: http://github-mcp:3004/mcp
      MCP_GITHUB_API_KEY: ${GITHUB_PAT:-}
      # n8n connector (once workflows are deployed)
      # MCP_N8N_URL: http://n8n:5678/mcp/your-trigger-path
      # MCP_N8N_API_KEY: ${N8N_MCP_API_KEY:-}
      MCP_OBSIDIAN_URL: ${MCP_OBSIDIAN_URL:-}
      MCP_OBSIDIAN_API_KEY: ${MCP_OBSIDIAN_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - everythingapp_web_data:/home/node/.everythingapp
    depends_on:
      - sandbox-mcp
      - playwright-mcp
      - github-mcp
    restart: unless-stopped
    networks:
      - sandbox-internal
      - browser-egress  # only to call playwright-mcp; the browser's own requests are guarded (urlSafety.ts)

  # n8n pipeline orchestrator — self-hosted, ISOLATED network.
  # CRITICAL: n8n is on n8n-net, NOT sandbox-internal.
  # Only its MCP endpoint is reachable from the app via the shared n8n-net attachment.
  # n8n never has access to the sandbox containers or the supervisor.
  # Uses its OWN Resend account/domain — NEVER share with Skarpa Bytom (§0).
  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:?N8N_USER is required}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:?N8N_PASSWORD is required}
      N8N_SECURE_COOKIE: "false"        # Pi sits behind Nginx TLS
      N8N_MCP_ACCESS_ENABLED: "true"   # MCP Server Trigger (n8n ≥ 2.20.0)
      N8N_PORT: 5678
      # SEPARATE Resend key for n8n — not the Skarpa Bytom key.
      RESEND_API_KEY: ${N8N_RESEND_API_KEY:-}
      N8N_HOST: ${N8N_HOST:-localhost}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    # n8n is on BOTH networks: n8n-net (its own isolated network) and
    # sandbox-internal (only so the app can reach its MCP endpoint).
    # It still cannot reach the sandbox containers or supervisor.
    networks:
      - n8n-net
      - sandbox-internal

networks:
  # Sandbox stack — zero overlap with Skarpa Bytom or any other Compose stack.
  sandbox-internal:
    driver: bridge

  # n8n's own isolated network — pipeline internal communication.
  n8n-net:
    driver: bridge

  # Browser agent: internet-facing. The fixed bridge name lets deploy/egress-guard.sh drop
  # traffic from it to private ranges (LAN, host, other bridges) at the network layer.
  browser-egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-ea-browser

volumes:
  everythingapp_web_data:
  n8n_data:
